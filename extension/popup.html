<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=420">
  <title>Nova IMS Timetable Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="6" width="28" height="24" rx="4" stroke="url(#grad1)" stroke-width="2"/>
          <path d="M2 14H30" stroke="url(#grad1)" stroke-width="2"/>
          <path d="M10 2V10" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
          <path d="M22 2V10" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
          <rect x="7" y="18" width="4" height="3" rx="0.5" fill="url(#grad1)" opacity="0.7"/>
          <rect x="14" y="18" width="4" height="3" rx="0.5" fill="url(#grad1)"/>
          <rect x="21" y="18" width="4" height="3" rx="0.5" fill="url(#grad1)" opacity="0.7"/>
          <rect x="7" y="24" width="4" height="3" rx="0.5" fill="url(#grad1)" opacity="0.4"/>
          <rect x="14" y="24" width="4" height="3" rx="0.5" fill="url(#grad1)" opacity="0.5"/>
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="logo-text">
          <h1>Timetable Export</h1>
          <span class="subtitle">Nova IMS → Calendar & ZIP</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-single-btn" data-tab="single">
          <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
          </svg>
          <span>Single Export</span>
        </button>
        <button class="tab-btn" id="tab-batch-btn" data-tab="batch">
          <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
          </svg>
          <span>Batch Export</span>
          <span class="tab-badge">PRO</span>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- ============================================================ -->
      <!-- SINGLE EXPORT TAB VIEW                                      -->
      <!-- ============================================================ -->
      <div id="view-single" class="tab-view active">
        <!-- Status Area (shown before extraction) -->
        <div id="status-area" class="status-area">
          <div class="status-icon" id="status-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <p id="status-text" class="status-text">Ready to export current timetable</p>
        </div>

        <!-- Options -->
        <div class="options">
          <div class="option-row">
            <label for="weeks-input" class="option-label">
              <svg class="option-icon" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.789l1.599.799L9 4.323V3a1 1 0 011-1z"/>
              </svg>
              Semester weeks
            </label>
            <div class="stepper">
              <button class="stepper-btn" id="weeks-dec" aria-label="Decrease weeks">−</button>
              <input type="number" id="weeks-input" class="stepper-input" value="15" min="1" max="52">
              <button class="stepper-btn" id="weeks-inc" aria-label="Increase weeks">+</button>
            </div>
          </div>
        </div>

        <!-- Preview Area (shown after extraction) -->
        <div id="preview-area" class="preview-area hidden">
          <div class="preview-header">
            <svg class="preview-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span id="preview-count">0 classes found</span>
          </div>
          <div id="preview-list" class="preview-list"></div>
        </div>

        <!-- Single Actions -->
        <div class="actions">
          <button id="export-btn" class="btn-primary">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            <span>Export .ics</span>
          </button>
          <button id="log-btn" class="btn-secondary hidden">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
            </svg>
            <span>Download Debug Log (.txt)</span>
          </button>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- BATCH EXPORT TAB VIEW (PUBLISH STUDENT GROUPS)               -->
      <!-- ============================================================ -->
      <div id="view-batch" class="tab-view">
        <!-- Discovery / Status Card -->
        <div id="batch-discovery-card" class="batch-card">
          <div class="batch-card-header">
            <div class="batch-header-title">
              <svg class="batch-card-icon" viewBox="0 0 20 20" fill="currentColor">
                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 3a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
              </svg>
              <span>Student Groups Scanner</span>
            </div>
            <button id="batch-rescan-btn" class="btn-chip" title="Scan again">
              <svg viewBox="0 0 20 20" fill="currentColor" class="chip-icon">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
              </svg>
              <span>Rescan</span>
            </button>
          </div>
          <p id="batch-scan-text" class="batch-scan-text">Scanning sidebar for student groups…</p>
        </div>

        <!-- Scope & Filters -->
        <div id="batch-controls" class="options">
          <div class="option-col">
            <label for="batch-program-select" class="option-label">
              <svg class="option-icon" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
              </svg>
              Export Scope
            </label>
            <select id="batch-program-select" class="select-dropdown">
              <option value="all">All Programs (Scanning...)</option>
            </select>
          </div>

          <div class="option-row">
            <label for="batch-weeks-input" class="option-label">
              <svg class="option-icon" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.789l1.599.799L9 4.323V3a1 1 0 011-1z"/>
              </svg>
              Semester weeks
            </label>
            <div class="stepper">
              <button class="stepper-btn" id="batch-weeks-dec" aria-label="Decrease weeks">−</button>
              <input type="number" id="batch-weeks-input" class="stepper-input" value="15" min="1" max="52">
              <button class="stepper-btn" id="batch-weeks-inc" aria-label="Increase weeks">+</button>
            </div>
          </div>

          <div class="option-checkbox-row">
            <label class="checkbox-label" for="batch-folders-check">
              <input type="checkbox" id="batch-folders-check" class="custom-checkbox" checked>
              <span class="checkbox-custom"></span>
              <span class="checkbox-text">Organize in folders (Program / Year / Group.ics)</span>
            </label>
          </div>
        </div>

        <!-- Live Progress Card -->
        <div id="batch-progress-area" class="batch-progress-card hidden">
          <div class="progress-header">
            <div class="progress-title-wrap">
              <span class="pulse-indicator"></span>
              <span id="batch-progress-title" class="progress-title">Batch Extracting…</span>
            </div>
            <span id="batch-progress-percent" class="progress-percent">0%</span>
          </div>

          <div class="progress-bar-bg">
            <div id="batch-progress-bar" class="progress-bar-fill" style="width: 0%;"></div>
          </div>

          <div class="progress-status-row">
            <span id="batch-current-group" class="current-group-badge">Extracting group…</span>
            <span id="batch-progress-counter" class="progress-counter">0 / 0</span>
          </div>
        </div>

        <!-- Batch Results Summary -->
        <div id="batch-results-area" class="batch-results-card hidden">
          <div class="results-header">
            <div class="results-badge">
              <svg viewBox="0 0 20 20" fill="currentColor" class="results-badge-icon">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
              </svg>
              <span>Extraction Complete</span>
            </div>
            <span id="batch-results-summary" class="results-summary-text">0 groups processed</span>
          </div>

          <!-- Scrollable Group Results Breakdown -->
          <div id="batch-results-list" class="batch-results-list"></div>
        </div>

        <!-- Batch Action Buttons -->
        <div class="actions">
          <button id="batch-start-btn" class="btn-primary">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            <span>Batch Export .ZIP</span>
          </button>
          <button id="batch-cancel-btn" class="btn-danger hidden">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            <span>Cancel Extraction</span>
          </button>
          <button id="batch-log-btn" class="btn-secondary hidden">
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
            </svg>
            <span>Download Batch Log (.txt)</span>
          </button>
        </div>
      </div>

      <!-- ============================================================ -->
      <!-- GLOBAL ERROR DISPLAY                                        -->
      <!-- ============================================================ -->
      <div id="error-area" class="error-area hidden">
        <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        <p id="error-text" class="error-text"></p>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer">
      <span id="footer-text">Works on Nova IMS Publish & Netpa</span>
    </div>
  </div>

  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
